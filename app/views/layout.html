<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

<nav class="navbar">

        <a href="/" class="navbar-brand">
            <span class="logo-dot"></span>
            SKIM
            <span class="navbar-badge">demo</span>
        </a>
        <div class="navbar-nav">
            <a href="/" <?= (($_SERVER['REQUEST_URI'] ?? '') === '/') ? 'class="active"' : '' ?>>Home</a>

        </div>
        <div class="navbar-actions">
            <? if (\Skim\Session\Session::has('user_id')) { ?>

                <a href="/logout" class="btn btn-ghost btn-sm">Sign out</a>
            <? } else { ?>
                <a href="/login" class="btn btn-primary btn-sm">Sign in</a>
            <? } ?>
        </div>
    </div>
</nav>

    </div>
<? } ?>
